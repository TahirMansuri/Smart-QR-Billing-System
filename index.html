<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MiniStore · Admin + Staff</title>
    <!-- QRCode.js for generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <!-- Guarantee that the QRCode constructor is available before any script runs -->
    <script>
        // If the script hasn't finished loading yet, create a tiny promise.
        window.QRCodeReady = new Promise(resolve => {
            if (window.QRCode) {
                resolve();
            } else {
                const check = setInterval(() => {
                    if (window.QRCode) {
                        clearInterval(check);
                        resolve();
                    }
                }, 50);
            }
        });
    </script>
    <!-- HTML5 QR Code for scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container" id="app">
        <h1><i class="fas fa-store"></i> MiniStore</h1>

        <!-- Tab navigation -->
        <div class="tabs no-print">
            <button class="tab-btn active" data-tab="admin"><i class="fas fa-user-cog"></i> Admin</button>
            <button class="tab-btn" data-tab="staff"><i class="fas fa-qrcode"></i> Staff</button>
        </div>

        <!-- ========== ADMIN PANEL ========== -->
        <div id="tab-admin" class="tab-content">
            <div class="card">
                <div class="card-title"><i class="fas fa-plus-circle"></i> Add Product</div>
                <form id="productForm">
                    <div class="form-group">
                        <label>Product name *</label>
                        <input type="text" id="pName" placeholder="e.g. Organic Honey" required>
                    </div>
                    <div class="form-group">
                        <label>Company / Brand</label>
                        <input type="text" id="pCompany" placeholder="e.g. Nature's Best">
                    </div>
                    <div class="row-2">
                        <div class="form-group">
                            <label>Price (₹)</label>
                            <input type="number" id="pPrice" placeholder="199" step="0.01" min="0">
                        </div>
                        <div class="form-group">
                            <label>Discount (%)</label>
                            <input type="number" id="pDiscount" placeholder="10" step="0.1" min="0" max="100">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Net Price (₹) <span
                                style="font-weight:400; color:#4b6a85;">(auto-calculated)</span></label>
                        <input type="text" id="pNet" placeholder="Calculated automatically" readonly
                            style="background:#ecf3f9; font-weight:600;">
                    </div>
                    <div class="row-2">
                        <div class="form-group">
                            <label>Mfg Date</label>
                            <input type="date" id="pMfg">
                        </div>
                        <div class="form-group">
                            <label>Expiry Date</label>
                            <input type="date" id="pExp">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Product Image</label>
                        <input type="file" id="pImage" accept="image/*" capture="environment">
                        <div id="imagePreview"></div>
                    </div>
                    <button type="submit" class="btn" id="saveProductBtn"><i class="fas fa-save"></i> Save & Generate
                        QR</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title"><i class="fas fa-qrcode"></i> QR Code Preview</div>
                <div class="qr-container" id="qrPreviewArea">
                    <div id="qrcode"></div>
                    <div class="qr-hint" id="qrProductName">Save a product to generate QR</div>
                </div>
                <button class="btn btn-secondary no-print" id="printQRBtn"><i class="fas fa-print"></i> Print QR
                    label</button>
            </div>

            <div class="card">
                <div class="flex-between">
                    <span class="card-title" style="margin:0"><i class="fas fa-boxes"></i> Products</span>
                    <button class="btn btn-secondary" style="width:auto; padding:8px 18px;" id="refreshList"><i
                            class="fas fa-sync-alt"></i></button>
                </div>
                <div id="productList"></div>
            </div>
        </div>

        <!-- ========== STAFF PANEL ========== -->
        <div id="tab-staff" class="tab-content hidden">
            <div class="card no-print">
                <div class="card-title"><i class="fas fa-qrcode"></i> Scan QR Code</div>
                <div class="scanner-area">
                    <div id="scanner-container"></div>
                    <div class="scanner-controls">
                        <button class="btn btn-success" id="startScannerBtn"><i class="fas fa-camera"></i> Start
                            Camera</button>
                        <button class="btn btn-danger" id="stopScannerBtn"><i class="fas fa-stop"></i> Stop</button>
                    </div>
                    <div style="margin-top: 12px;">
                        <label style="font-size:0.85rem;">Or enter manually:</label>
                        <input type="text" id="scan-input" placeholder="Paste product ID (e.g. PROD_123)">
                        <button class="btn btn-secondary" id="scanLookupBtn" style="margin-top:6px;"><i
                                class="fas fa-search"></i> Lookup</button>
                    </div>
                    <div id="scan-result" class="hidden">
                        <div id="scannedProductInfo"></div>
                        <div class="qty-control flex" style="justify-content:center; margin-top:10px;">
                            <button id="qtyDec">−</button>
                            <span id="qtyDisplay">1</span>
                            <button id="qtyInc">+</button>
                        </div>
                        <button class="btn btn-success" id="addToBillBtn"><i class="fas fa-cart-plus"></i> Add to
                            bill</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="flex-between">
                    <span class="card-title" style="margin:0"><i class="fas fa-receipt"></i> Current Bill</span>
                    <button class="btn btn-secondary no-print" style="width:auto; padding:8px 16px;" id="clearBillBtn"><i
                            class="fas fa-trash-alt"></i> Clear</button>
                </div>
                <div id="billItems"></div>
                <div class="bill-total text-center" id="billTotal">Total: ₹0.00</div>
                <button class="btn no-print" id="printBillBtn"><i class="fas fa-print"></i> Print Bill</button>
            </div>
        </div>
    </div>

    <!-- Developer Trademark / Identity -->
    <div style="text-align: center; margin: 30px auto 10px; max-width: 500px; padding: 0 12px; font-size: 0.9rem; color: #4b6a85;" class="no-print">
        <hr style="border: 0; border-top: 1px solid #dce5ed; margin-bottom: 15px;">
        <p style="font-weight: 700; color: #0f3b5e; font-size: 1rem;"><i class="fas fa-shield-alt" style="color: #2a7faa;"></i> Developed by - Tahir Husen Najir Mansuri</p>
        <p style="margin-top: 4px; font-weight: 500;">(Lead System Engineer / HOD, IMRD Shahada)</p>
        <p style="font-size: 0.75rem; margin-top: 8px; opacity: 0.8;">&copy; 2026 All Rights Reserved.</p>
    </div>


    <script src="app.js"></script>

</body>

</html>
